<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><div th:fragment="heart(p,back)" class="favorite-control"><form sec:authorize="isAuthenticated()" th:action="@{/favorites/{id}(id=${p.id})}" method="post" data-favorite-form th:attr="data-state-url=@{/favorites/{id}/state(id=${p.id})},data-product-id=${p.id}"><input type="hidden" name="favorite" th:value="${!favoriteIds.contains(p.id)}"><input type="hidden" name="back" th:value="${back}"><button type="submit" class="favorite-heart" th:classappend="${favoriteIds.contains(p.id)?'is-favorite':''}" th:attr="aria-pressed=${favoriteIds.contains(p.id)},aria-label=${favoriteIds.contains(p.id)?'Bỏ yêu thích bánh '+p.name:'Thêm vào yêu thích bánh '+p.name}" th:title="${favoriteIds.contains(p.id)?'Bỏ yêu thích':'Thêm vào yêu thích'}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.5 4.6a5.4 5.4 0 0 0-7.6 0L12 5.5l-.9-.9a5.4 5.4 0 0 0-7.6 7.6L12 21l8.5-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg></button><span class="favorite-status visually-hidden" role="status" aria-live="polite"></span></form><a sec:authorize="isAnonymous()" th:href="@{/login}" class="favorite-heart" aria-label="Đăng nhập để thêm bánh yêu thích" title="Đăng nhập để lưu bánh yêu thích"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.5 4.6a5.4 5.4 0 0 0-7.6 0L12 5.5l-.9-.9a5.4 5.4 0 0 0-7.6 7.6L12 21l8.5-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg></a></div></body></html>
