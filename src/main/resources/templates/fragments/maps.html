<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="picker(prefix,value)" class="address-picker mb-3" data-address-picker th:attr="data-search-url=@{/api/maps/search},data-reverse-url=@{/api/maps/reverse}">
 <input type="hidden" data-latitude th:name="${prefix+'latitude'}" th:value="${value.latitude}"><input type="hidden" data-longitude th:name="${prefix+'longitude'}" th:value="${value.longitude}">
 <div class="d-flex flex-wrap gap-2 mb-2"><button type="button" class="btn btn-outline-primary btn-sm" data-open-map>Mở bản đồ chọn địa chỉ</button><button type="button" class="btn btn-primary btn-sm" data-locate>Lấy vị trí hiện tại</button></div>
 <div data-map-tools hidden><div class="input-group mb-2"><input type="search" data-map-query maxlength="200" class="form-control" aria-label="Địa chỉ tìm trên bản đồ" placeholder="Nhập đường, phường/xã, tỉnh/thành phố"><button type="button" class="btn btn-outline-primary" data-map-search>Tìm trên bản đồ</button></div><div data-map-results class="list-group mb-2"></div><div data-map-canvas class="bakery-map" aria-label="Bản đồ chọn địa chỉ"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" data-reverse class="btn btn-outline-primary btn-sm">Điền địa chỉ tại ghim</button><button type="button" data-clear-pin class="btn btn-outline-secondary btn-sm">Bỏ ghim</button></div></div>
 <p class="small mt-2 mb-1" data-map-status role="status" aria-live="polite">Bấm vị trí trên bản đồ hoặc lấy GPS, rồi kiểm tra lại địa chỉ bên dưới.</p><p class="small muted mb-0">Bạn có thể nhập địa chỉ bằng tay. Bản đồ dùng OpenStreetMap, tra địa chỉ qua Photon; khi tra cứu, tọa độ hoặc nội dung tìm sẽ được gửi đến dịch vụ bản đồ. Bổ sung số nhà, tầng, hẻm và ghi chú giao hàng cho chính xác.</p>
</div>
<th:block th:fragment="assets"><link rel="stylesheet" th:href="@{/css/leaflet.css}"><link rel="stylesheet" th:href="@{/css/maps.css}"><script th:src="@{/js/leaflet.js}" defer></script><script th:src="@{/js/address-map.js(v=2)}" defer></script><script th:src="@{/js/delivery-map.js(v=2)}" defer></script></th:block>
</body></html>
