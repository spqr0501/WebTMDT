<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="delivery"><h2 class="h5 mb-3">Lịch giao / nhận</h2><dl class="row gy-2 mb-0"><dt class="col-sm-5">Người nhận:</dt><dd class="col-sm-7" th:text="${request.recipient}"></dd><dt class="col-sm-5">SĐT:</dt><dd class="col-sm-7" th:text="${request.phone}"></dd><dt class="col-sm-5">Ngày nhận:</dt><dd class="col-sm-7" th:text="${#temporals.format(request.receiveDate,'dd/MM/yyyy')}"></dd><dt class="col-sm-5">Khung giờ:</dt><dd class="col-sm-7" th:text="${request.receiveSlot}"></dd><dt class="col-sm-5">Hình thức nhận:</dt><dd class="col-sm-7" th:text="${request.fulfillmentMethod.label}"></dd><dt class="col-sm-5">Địa chỉ:</dt><dd class="col-sm-7 text-break" style="white-space:pre-line" th:text="${request.address}"></dd><dt class="col-sm-5">Thanh toán:</dt><dd class="col-sm-7" th:text="${request.paymentMethod.label}"></dd><dt class="col-sm-5">Kế hoạch trả:</dt><dd class="col-sm-7" th:text="${request.payment.plan.label}"></dd></dl></div></body></html>
