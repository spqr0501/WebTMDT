<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="field(inputId,fieldName,autoComplete,minLength)" class="password-field mb-3">
 <input th:id="${inputId}" th:name="${fieldName}" type="password" th:autocomplete="${autoComplete}" th:minlength="${minLength}" maxlength="72" required class="form-control" data-password-input>
 <button type="button" class="password-toggle" data-password-toggle th:attr="aria-controls=${inputId}" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
  <svg class="password-eye" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="password-eye-off" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 3 18 18M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3 4M6.3 6.3C3.5 8.5 2 12 2 12s3.5 7 10 7c2.1 0 4-.7 5.6-1.7M10 10a3 3 0 0 0 4 4"/></svg>
 </button>
</div>
</body></html>
