<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/shop :: head}"></head><body><header th:replace="~{fragments/shop :: header}"></header><main class="container main-content"><span class="eyebrow">GIAO BÁNH CÙNG BÓNG BAKERY</span><h1 class="section-title mt-2">Đơn giao của tôi</h1><p>Chỉ hiển thị đơn được cửa hàng phân công cho bạn. Bật GPS khi bắt đầu giao, tắt sau khi bàn giao bánh.</p><article th:each="o:${page.content}" class="panel shipper-card mb-3"><div class="d-flex flex-wrap justify-content-between gap-3"><h2 class="h5" th:text="${'Đơn #'+o.id+' · '+o.recipient}"></h2><span class="order-status" th:text="${o.handedOverAt!=null?'Đã báo bàn giao':o.status.label}"></span></div><p th:text="${o.deliveryAddress}"></p><p th:text="${o.deliveryDate+' · '+o.deliverySlot}"></p><a class="btn btn-primary" th:href="@{/shipper/orders/{id}(id=${o.id})}">Xem đơn &amp; giao bánh</a></article><p class="panel" th:if="${page.empty}">Bạn chưa có đơn đang được phân công.</p><nav class="d-flex gap-3"><a th:if="${page.hasPrevious()}" th:href="@{/shipper(page=${page.number-1})}">Trang trước</a><a th:if="${page.hasNext()}" th:href="@{/shipper(page=${page.number+1})}">Trang sau</a></nav></main><footer th:replace="~{fragments/shop :: footer}"></footer></body></html>
