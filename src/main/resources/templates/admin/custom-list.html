<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/admin :: head}"></head><body class="hold-transition sidebar-mini"><div class="wrapper"><header th:replace="~{fragments/admin :: header}"></header><main class="content-wrapper p-4"><div th:replace="~{fragments/shop :: alerts}"></div><div class="d-flex justify-content-between flex-wrap gap-3 mb-4"><div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1 class="section-title">Bánh thiết kế riêng</h1><p>Biến ý tưởng của khách thành những chiếc bánh mang dấu ấn riêng.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="fas fa-palette"></i></span></div><a th:unless="${isAdmin}" th:href="@{/custom-cakes/new}" class="btn btn-primary">+ Gửi ý tưởng mới</a></div><form th:if="${isAdmin}" method="get" class="mb-4"><select name="status" class="form-control"><option value="">Tất cả trạng thái</option><option th:each="s:${statuses}" th:value="${s}" th:selected="${s == status}" th:text="${s.label}"></option></select><button class="btn btn-primary mt-2">Lọc</button></form><div class="table-responsive"><table class="table"><thead><tr><th>Mã</th><th>Người nhận</th><th>Ngày nhận</th><th>Hương vị</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="r:${page.content}"><td th:text="${'#TK'+r.id}"></td><td th:text="${r.recipient}"></td><td th:text="${#temporals.format(r.receiveDate,'dd/MM/yyyy')}"></td><td th:text="${r.flavor}"></td><td><span th:class="${'state-pill state-'+#strings.toLowerCase(r.status.name())}" th:text="${r.status.label}"></span></td><td><a class="table-action" th:href="${isAdmin}?@{/admin/custom-cakes/{id}(id=${r.id})}:@{/custom-cakes/{id}(id=${r.id})}">Chi tiết <span aria-hidden="true">↗</span></a></td></tr></tbody></table></div><p th:if="${page.empty}">Chưa có yêu cầu phù hợp.</p><nav class="d-flex gap-3"><a th:if="${page.hasPrevious()}" th:href="${isAdmin}?@{/admin/custom-cakes(page=${page.number-1},status=${status})}:@{/custom-cakes(page=${page.number-1})}">← Trước</a><a th:if="${page.hasNext()}" th:href="${isAdmin}?@{/admin/custom-cakes(page=${page.number+1},status=${status})}:@{/custom-cakes(page=${page.number+1})}">Tiếp →</a></nav></main><footer th:replace="~{fragments/admin :: footer}"></footer></div></body></html>
