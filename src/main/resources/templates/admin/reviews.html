<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/admin :: head}"></head><body class="hold-transition sidebar-mini"><div class="wrapper"><header th:replace="~{fragments/admin :: header}"></header><main class="content-wrapper p-4"><div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1>Đánh giá của khách hàng</h1><p>Lắng nghe những chia sẻ sau khi khách thưởng thức bánh.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="far fa-star"></i></span></div><p>Chỉ khách có đơn hoàn thành được đánh giá. Đánh giá bị ẩn không được tính vào điểm sao công khai.</p><article class="card card-body" th:each="r:${page.content}"><h2 class="h5" th:text="${r.product.name + ' · ' + r.rating + ' sao'}"></h2><p th:text="${r.user.name}"></p><p th:text="${r.comment}"></p><div><a th:each="photo:${r.photos}" th:href="${photo}" target="_blank" rel="noopener"><img th:src="${photo}" alt="Ảnh đánh giá" width="90" height="90" style="object-fit:cover;margin:4px"></a></div><p th:if="${!r.visible}" th:text="${'Đã ẩn: ' + r.moderationReason}"></p><form th:action="@{/admin/reviews/{id}/visibility(id=${r.id})}" method="post" class="mt-3"><input type="hidden" name="visible" th:value="${!r.visible}"><input th:if="${r.visible}" name="reason" maxlength="300" required placeholder="Lý do ẩn đánh giá" class="form-control mb-2"><button class="btn btn-outline-secondary" th:text="${r.visible ? 'Ẩn đánh giá' : 'Hiện lại'}"></button></form></article><p th:if="${page.empty}">Chưa có đánh giá.</p><a th:if="${page.hasPrevious()}" th:href="@{/admin/reviews(page=${page.number-1})}">← Trước</a> <a th:if="${page.hasNext()}" th:href="@{/admin/reviews(page=${page.number+1})}">Tiếp →</a></main><footer th:replace="~{fragments/admin :: footer}"></footer></div></body></html>
