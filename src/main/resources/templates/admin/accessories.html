<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/admin :: head}"></head><body class="hold-transition sidebar-mini"><div class="wrapper"><header th:replace="~{fragments/admin :: header}"></header><main class="content-wrapper p-4"><div th:replace="~{fragments/shop :: alerts}"></div><div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1 class="h2">Phụ kiện · Nến &amp; thiệp</h1><p>Nến và thiệp nhỏ xinh giúp món quà thêm trọn vẹn.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="fas fa-gift"></i></span></div><p><a class="btn btn-outline-primary" th:href="@{/admin/import}">Nhập nến / thiệp từ Excel</a></p><p>Khách chọn phụ kiện cùng bánh tại bước đặt hàng. Phụ kiện có tồn kho riêng; giảm giá chỉ áp dụng tiền bánh.</p><div class="card card-body table-responsive"><table class="table"><thead><tr><th>Tên</th><th>Giá</th><th>Tồn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="a:${accessories}"><td th:text="${a.name}"></td><td th:text="${#numbers.formatDecimal(a.price,0,'POINT',0,'COMMA')+' đ'}"></td><td><strong th:text="${a.stock}"></strong><form th:action="@{/admin/accessories/{id}/stock(id=${a.id})}" method="post" class="d-flex mt-2"><input type="number" name="delta" min="-1000000" max="1000000" required aria-label="Số lượng nhập hoặc xuất" placeholder="+ / -" class="form-control" style="max-width:110px"><button class="btn btn-outline-secondary">Điều chỉnh</button></form></td><td th:text="${a.active?'Đang bán':'Ngừng bán'}"></td><td><a class="table-action" th:href="@{/admin/accessories/{id}/edit(id=${a.id})}"><i class="far fa-edit mr-1" aria-hidden="true"></i>Sửa</a><form th:action="@{/admin/accessories/{id}/delete(id=${a.id})}" method="post" data-confirm-accessory-delete class="mt-2"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr></tbody></table></div><form th:action="@{/admin/accessories/save}" th:object="${form}" method="post" class="card card-body"><h2 class="h4" th:text="${form.id == null ? 'Thêm phụ kiện' : 'Sửa phụ kiện'}"></h2><div th:replace="~{fragments/shop :: errors}"></div><input type="hidden" th:field="*{id}"><label for="name">Tên phụ kiện</label><input id="name" th:field="*{name}" maxlength="100" required class="form-control mb-3"><label for="price">Giá (đ)</label><input id="price" type="number" th:field="*{price}" min="0" max="999999999" required class="form-control mb-3"><div th:if="${form.id == null}"><label for="stock">Tồn ban đầu</label><input id="stock" type="number" th:field="*{stock}" min="0" max="1000000" required class="form-control mb-3"></div><label><input type="checkbox" th:field="*{active}"> Đang bán</label><button class="btn btn-primary mt-3">Lưu phụ kiện</button><a th:href="@{/admin/accessories}" class="mt-3">Thêm phụ kiện khác</a></form></main><footer th:replace="~{fragments/admin :: footer}"></footer></div></body></html>
