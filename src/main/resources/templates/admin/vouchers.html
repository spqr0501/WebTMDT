<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head}"></head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
<header th:replace="~{fragments/admin :: header}"></header>
<main class="content-wrapper p-4">
<div th:replace="~{fragments/shop :: alerts}"></div>
<div class="d-flex justify-content-between mb-4"><div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1 class="h2">Mã giảm giá</h1><p>Gửi một chút ưu đãi cho những dịp thật ngọt ngào.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="fas fa-ticket-alt"></i></span></div><a class="btn btn-primary" th:href="@{/admin/vouchers/new}">+ Tạo mã giảm giá</a></div><div class="card card-body table-responsive"><table class="table"><thead><tr><th>Mã</th><th>Mức giảm</th><th>Đơn tối thiểu</th><th>Lượt dùng</th><th>Thời hạn</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="v:${page.content}"><td><span class="admin-code" th:text="${v.code}"></span></td><td th:text="${v.amount + (v.type.name() == 'PERCENT' ? '%' : ' đ')}"></td><td th:text="${v.minOrder}"></td><td th:text="${v.usedCount + '/' + v.usageLimit + ' · ' + v.perUserLimit + '/người'}"></td><td><span th:text="${#temporals.format(v.startsAt,'dd/MM/yyyy HH:mm')}"></span><br><span th:text="${#temporals.format(v.endsAt,'dd/MM/yyyy HH:mm')}"></span></td><td><span th:class="${v.currentlyApplicable?'state-pill state-enabled':'state-pill state-disabled'}" th:text="${v.statusLabel}"></span></td><td><a class="table-action" th:href="@{/admin/vouchers/{id}/edit(id=${v.id})}"><i class="far fa-edit mr-1" aria-hidden="true"></i>Sửa</a><form th:action="@{/admin/vouchers/{id}/delete(id=${v.id})}" method="post"><button class="btn btn-sm btn-outline-danger mt-2">Xóa / ngừng dùng</button></form></td></tr></tbody></table></div><p class="text-muted">Mã giảm giá đã dùng sẽ được tắt thay vì xóa. Thời gian theo múi giờ chạy ứng dụng (Asia/Ho_Chi_Minh).</p><nav class="d-flex my-4" aria-label="Phân trang"><a class="btn btn-outline-secondary" th:if="${page.hasPrevious()}" th:href="@{/admin/vouchers(page=${page.number - 1})}">← Trước</a><span class="p-2" th:text="${'Trang ' + (page.number + 1)}"></span><a class="btn btn-outline-secondary" th:if="${page.hasNext()}" th:href="@{/admin/vouchers(page=${page.number + 1})}">Sau →</a></nav>
</main>
<footer th:replace="~{fragments/admin :: footer}"></footer>
</div>
</body></html>
