<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/admin :: head}"></head><body class="hold-transition sidebar-mini"><div class="wrapper"><header th:replace="~{fragments/admin :: header}"></header><main class="content-wrapper p-4"><h1 class="h2 mb-4" th:text="${form.id==null?'Thêm shipper':'Cập nhật shipper'}"></h1><form class="card card-body" th:action="@{/admin/shippers/save}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><div th:replace="~{fragments/shop :: errors}"></div><label for="name">Họ tên</label><input id="name" th:field="*{name}" required maxlength="100" class="form-control mb-3"><label for="email">Email đăng nhập</label><input id="email" th:field="*{email}" type="email" required maxlength="190" class="form-control mb-3"><label for="phone">Số điện thoại</label><input id="phone" th:field="*{phone}" type="tel" required maxlength="20" class="form-control mb-3"><label for="vehicle">Phương tiện / biển số</label><input id="vehicle" th:field="*{vehicle}" required maxlength="100" class="form-control mb-3" placeholder="Ví dụ: Xe máy · 59A1-123.45"><label for="shipperPassword" th:text="${form.id==null?'Mật khẩu đăng nhập':'Mật khẩu mới (để trống để giữ nguyên)'}"></label><input id="shipperPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" th:required="${form.id==null}" class="form-control mb-3"><label class="mb-3"><input type="checkbox" th:field="*{enabled}"> Đang hoạt động</label><p class="small text-muted">Thay đổi tài khoản sẽ yêu cầu shipper đăng nhập lại. Không thể ngừng shipper còn đơn đang phụ trách.</p><div><button class="btn btn-primary">Lưu shipper</button> <a class="btn btn-outline-secondary" th:href="@{/admin/shippers}">Quay lại</a></div></form></main><footer th:replace="~{fragments/admin :: footer}"></footer></div></body></html>
