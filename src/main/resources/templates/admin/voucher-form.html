<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head}"></head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
<header th:replace="~{fragments/admin :: header}"></header>
<main class="content-wrapper p-4">
<div th:replace="~{fragments/shop :: alerts}"></div>
<div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1 class="h2 mb-4">Thiết lập mã giảm giá</h1><p>Thiết lập mức giảm, thời hạn và giới hạn sử dụng rõ ràng.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="fas fa-ticket-alt"></i></span></div><form th:action="@{/admin/vouchers/save}" th:object="${form}" method="post" class="card card-body admin-voucher-form"><input type="hidden" th:field="*{id}"><div th:replace="~{fragments/shop :: errors}"></div><div class="form-group"><label for="code">Mã (3–40 ký tự chữ, số, dấu _ hoặc -)</label><input id="code" type="text" th:field="*{code}" class="form-control" required maxlength="40"></div><div class="form-group"><label for="type">Loại giảm giá</label><select id="type" th:field="*{type}" class="form-control"><option value="PERCENT">Phần trăm</option><option value="FIXED">Số tiền cố định</option></select></div><div class="form-group"><label for="amount">Mức giảm (% hoặc đ)</label><input id="amount" type="number" th:field="*{amount}" class="form-control" required min="1" max="999999999"></div><div class="form-group"><label for="minOrder">Giá trị đơn tối thiểu (đ)</label><input id="minOrder" type="number" th:field="*{minOrder}" class="form-control" required min="0"></div><div class="form-group"><label for="maxDiscount">Giảm tối đa (đ) · để trống nếu không giới hạn</label><input id="maxDiscount" type="number" th:field="*{maxDiscount}" class="form-control" min="1"></div><div class="form-group"><label for="startsAt">Bắt đầu (giờ Việt Nam)</label><input id="startsAt" type="datetime-local" th:field="*{startsAt}" class="form-control" required></div><div class="form-group"><label for="endsAt">Kết thúc (không bao gồm thời điểm này)</label><input id="endsAt" type="datetime-local" th:field="*{endsAt}" class="form-control" required></div><div class="form-group"><label for="usageLimit">Tổng lượt tối đa</label><input id="usageLimit" type="number" th:field="*{usageLimit}" class="form-control" required min="1" max="1000000"></div><div class="form-group"><label for="perUserLimit">Lượt mỗi tài khoản</label><input id="perUserLimit" type="number" th:field="*{perUserLimit}" class="form-control" required min="1" max="1000"></div><div class="form-check mb-3"><input id="active" th:field="*{active}" type="checkbox" class="form-check-input"><label class="form-check-label" for="active">Cho phép áp dụng</label></div><p>Mỗi đơn dùng một mã. Giảm trên tiền bánh, không giảm phí giao hàng. Hủy đơn không hoàn lượt dùng.</p><button class="btn btn-primary">Lưu mã giảm giá</button></form>
</main>
<footer th:replace="~{fragments/admin :: footer}"></footer>
</div>
</body></html>
