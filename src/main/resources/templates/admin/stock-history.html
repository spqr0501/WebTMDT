<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/admin :: head}"></head><body class="hold-transition sidebar-mini"><div class="wrapper"><header th:replace="~{fragments/admin :: header}"></header><main class="content-wrapper p-4"><div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1>Lịch sử tồn kho</h1><p>Theo dõi mỗi lần nhập, xuất và hoàn kho của cửa hàng.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="fas fa-boxes"></i></span></div><p>Ghi nhận các thay đổi kể từ khi nâng cấp chức năng này.</p><form method="get"><label>Mã sản phẩm (để trống để xem tất cả)<input type="number" name="productId" th:value="${productId}" class="form-control"></label><button class="btn btn-primary">Lọc</button></form><div class="table-responsive"><table class="table bg-white"><thead><tr><th>Thời điểm</th><th>Bánh</th><th>Thay đổi</th><th>Tồn sau</th><th>Lý do</th><th>Người thực hiện</th></tr></thead><tbody><tr th:each="r:${page.content}"><td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.product.name}"></td><td th:text="${r.delta}"></td><td th:text="${r.balance}"></td><td th:text="${r.reason}"></td><td th:text="${r.actor}"></td></tr></tbody></table></div><a th:if="${page.hasPrevious()}" th:href="@{/admin/stock-history(page=${page.number-1},productId=${productId})}">← Trước</a> <a th:if="${page.hasNext()}" th:href="@{/admin/stock-history(page=${page.number+1},productId=${productId})}">Tiếp →</a></main><footer th:replace="~{fragments/admin :: footer}"></footer></div></body></html>
