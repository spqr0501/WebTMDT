<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head}"></head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
<header th:replace="~{fragments/admin :: header}"></header>
<main class="content-wrapper p-4">
<div th:replace="~{fragments/shop :: alerts}"></div>
<div class="admin-heading"><div><span class="admin-overline">BÓNG BAKERY / QUẢN TRỊ</span><h1 class="h2 mb-4">Quản lý đơn hàng</h1><p>Theo dõi lịch nhận và chăm chút từng bước của đơn bánh.</p></div><span class="admin-heading-icon" aria-hidden="true"><i class="fas fa-shopping-bag"></i></span></div><form method="get" class="admin-filter mb-4"><div class="admin-filter-field"><label for="status">Lọc theo trạng thái</label><select id="status" name="status" class="form-control"><option value="">Tất cả đơn bánh</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select></div><button class="btn btn-primary"><i class="fas fa-filter mr-2" aria-hidden="true"></i>Lọc đơn</button><a class="btn btn-outline-secondary" th:href="@{/admin/orders}">Xóa bộ lọc</a><span class="admin-table-count ml-auto" th:text="${page.totalElements+' đơn phù hợp'}"></span></form><div class="table-responsive"><table class="table"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th>Giao / nhận</th><th></th></tr></thead><tbody><tr th:each="o:${page.content}"><td th:text="${'#' + o.id}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(o.total,0,'POINT',0,'COMMA') + ' đ'}"></td><td><span th:class="${'state-pill state-'+#strings.toLowerCase(o.status.name())}" th:text="${o.status.label}"></span></td><td><span th:text="${o.fulfillmentMethod.label}"></span><br><small th:if="${o.deliveryDate != null}" th:text="${#temporals.format(o.deliveryDate,'dd/MM/yyyy')+' · '+o.deliverySlot}"></small><br><span th:if="${o.preorder}" class="badge bg-info">Đặt trước</span></td><td><a class="table-action" th:href="@{/admin/orders/{id}(id=${o.id})}">Chi tiết <span aria-hidden="true">↗</span></a></td></tr></tbody></table></div><p th:if="${page.empty}">Chưa có đơn hàng.</p><nav class="d-flex my-4" aria-label="Phân trang"><a class="btn btn-outline-secondary" th:if="${page.hasPrevious()}" th:href="@{/admin/orders(page=${page.number - 1},status=${status})}">← Trước</a><span class="p-2" th:text="${'Trang ' + (page.number + 1)}"></span><a class="btn btn-outline-secondary" th:if="${page.hasNext()}" th:href="@{/admin/orders(page=${page.number + 1},status=${status})}">Sau →</a></nav>
</main>
<footer th:replace="~{fragments/admin :: footer}"></footer>
</div>
</body></html>
