<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/shop :: head}"></head>
<body >

<header th:replace="~{fragments/shop :: header}"></header>
<main class="container main-content">
<div th:replace="~{fragments/shop :: alerts}"></div>

<h1 class="section-title mb-4">Địa chỉ giao bánh</h1><div class="row g-4"><div class="col-md-6"><div class="panel mb-3" th:each="a:${addresses}"><strong th:text="${a.recipient}"></strong><p th:text="${a.phone}"></p><p class="mb-0" th:text="${a.detail}"></p></div><p th:if="${#lists.isEmpty(addresses)}">Bạn chưa lưu địa chỉ giao hàng.</p></div><div class="col-md-6"><form data-address-entry class="panel" th:action="@{/account/addresses}" method="post" th:object="${form}"><h2 class="h5 mb-3">Thêm địa chỉ</h2><div th:replace="~{fragments/shop :: errors}"></div><label for="recipient" class="form-label">Người nhận</label><input id="recipient" th:field="*{recipient}" required maxlength="100" class="form-control mb-3"><label for="phone" class="form-label">Số điện thoại</label><input id="phone" th:field="*{phone}" required maxlength="20" class="form-control mb-3"><div th:replace="~{fragments/maps :: picker('',${form})}"></div><label for="detail" class="form-label">Số nhà, đường, phường/xã, tỉnh/thành phố</label><textarea data-address-text id="detail" th:field="*{detail}" required maxlength="500" class="form-control mb-4"></textarea><button class="btn btn-primary">Lưu &amp; tiếp tục đặt hàng</button></form></div></div>

</main>
<footer th:replace="~{fragments/shop :: footer}"></footer>

<th:block th:replace="~{fragments/maps :: assets}"></th:block></body></html>
