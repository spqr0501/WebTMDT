<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/shop :: head}"></head><body><header th:replace="~{fragments/shop :: header}"></header><main class="container main-content"><div th:replace="~{fragments/shop :: alerts}"></div><span class="eyebrow">NHỮNG CHIẾC BÁNH BẠN MUỐN GIỮ LẠI</span><h1 class="section-title mt-2">Bánh yêu thích</h1><p th:text="${page.totalElements+' chiếc bánh đang bán trong danh sách của bạn'}"></p><p class="panel" th:if="${page.empty}">Danh sách còn trống. Bấm vào trái tim ở chiếc bánh bạn thích để lưu tại đây. <a th:href="@{/products}">Khám phá bánh →</a></p><div th:replace="~{fragments/shop :: cards(${products})}"></div><nav class="d-flex gap-3 my-4"><a th:if="${page.hasPrevious()}" th:href="@{/favorites(page=${page.number-1})}">← Trước</a><a th:if="${page.hasNext()}" th:href="@{/favorites(page=${page.number+1})}">Tiếp →</a></nav><p class="small text-muted">Lưu yêu thích không giữ hàng hoặc cố định giá. Bánh tạm hết vẫn có thể lưu, bánh đã ngừng bán được ẩn.</p></main><footer th:replace="~{fragments/shop :: footer}"></footer></body></html>
