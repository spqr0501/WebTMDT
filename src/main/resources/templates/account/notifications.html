<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/shop :: head}"></head><body><header th:replace="~{fragments/shop :: header}"></header><main class="container main-content"><div th:replace="~{fragments/shop :: alerts}"></div><div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><span class="eyebrow">BÓNG BAKERY</span><h1 class="section-title">Thông báo của bạn</h1></div><form th:action="@{/notifications/read-all}" method="post"><button class="btn btn-outline-dark">Đánh dấu tất cả đã đọc</button></form></div><p class="muted">Thông báo được lưu trong website. Số chưa đọc tự cập nhật khi bạn đang mở trang.</p><article th:each="n:${page.content}" th:class="${n.read ? 'panel mb-3' : 'panel notification-unread mb-3'}"><div class="d-flex justify-content-between flex-wrap gap-2"><h2 class="h5" th:text="${n.title}"></h2><small th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}"></small></div><p class="review-text" th:text="${n.message}"></p><form th:action="@{/notifications/{id}/open(id=${n.id})}" method="post"><button class="btn btn-outline-dark btn-sm">Xem chi tiết</button> <span th:unless="${n.read}" class="small text-danger">Chưa đọc</span></form></article><p th:if="${page.empty}" class="panel">Chưa có thông báo. Thông báo mới sẽ xuất hiện khi bạn đặt bánh hoặc đơn được cập nhật.</p><nav class="d-flex gap-3"><a th:if="${page.hasPrevious()}" th:href="@{/notifications(page=${page.number-1})}">← Trước</a><a th:if="${page.hasNext()}" th:href="@{/notifications(page=${page.number+1})}">Tiếp →</a></nav></main><footer th:replace="~{fragments/shop :: footer}"></footer></body></html>
