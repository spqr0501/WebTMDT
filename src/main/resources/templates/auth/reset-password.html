<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/shop :: head}"></head><body><header th:replace="~{fragments/shop :: header}"></header><main class="container main-content"><div class="panel auth-panel"><span class="eyebrow">BÓNG BAKERY / TÀI KHOẢN</span><h1 class="section-title mt-2">Đặt mật khẩu mới</h1><p class="alert alert-danger" th:if="${formError}" th:text="${formError}"></p><div th:unless="${validToken}"><p>Liên kết không hợp lệ, đã dùng hoặc hết hạn. Vui lòng yêu cầu liên kết mới.</p><a class="btn btn-primary" th:href="@{/forgot-password}">Yêu cầu liên kết mới</a></div><form th:if="${validToken}" th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><label for="registerPassword" class="form-label">Mật khẩu mới (từ 8 ký tự)</label><div th:replace="~{fragments/password :: field('registerPassword','password','new-password',8)}"></div><label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label><div th:replace="~{fragments/password :: field('confirmPassword','confirmPassword','new-password',8)}"></div><button class="btn btn-primary w-100">Lưu mật khẩu mới</button><p class="small text-muted mt-3">Sau khi đổi, các phiên đăng nhập cũ sẽ hết hiệu lực. Bạn cần đăng nhập lại.</p></form></div></main><footer th:replace="~{fragments/shop :: footer}"></footer></body></html>
