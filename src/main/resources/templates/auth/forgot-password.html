<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/shop :: head}"></head><body><header th:replace="~{fragments/shop :: header}"></header><main class="container main-content"><div class="panel auth-panel"><span class="eyebrow">KHÔI PHỤC TÀI KHOẢN</span><h1 class="section-title mt-2">Quên mật khẩu?</h1><p>Nhập email tài khoản để nhận liên kết đặt lại mật khẩu, có hiệu lực 15 phút và chỉ dùng một lần.</p><div th:replace="~{fragments/shop :: alerts}"></div><p class="alert alert-danger" th:if="${formError}" th:text="${formError}"></p><p class="alert alert-warning" th:unless="${mailReady}">Chức năng khôi phục qua email đang tạm chưa sẵn sàng. Vui lòng liên hệ cửa hàng.</p><form th:action="@{/forgot-password}" method="post"><label for="recoveryEmail" class="form-label">Email đăng ký</label><input id="recoveryEmail" name="email" type="email" maxlength="190" required autocomplete="email" class="form-control mb-3"><button class="btn btn-primary w-100" th:disabled="${!mailReady}">Gửi liên kết khôi phục</button></form><a class="d-block mt-3" th:href="@{/login}">← Về đăng nhập</a></div></main><footer th:replace="~{fragments/shop :: footer}"></footer></body></html>
