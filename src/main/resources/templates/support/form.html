<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/shop :: head}"></head><body><header th:replace="~{fragments/shop :: header}"></header><main class="container main-content"><span class="eyebrow">MỘT NHÂN VIÊN SẼ XEM PHIẾU CỦA BẠN</span><h1 class="section-title mt-2">Gửi phiếu hỗ trợ</h1><p>Ghi mã đơn và vấn đề cần cửa hàng kiểm tra. Phiếu là hộp thư trên website, chưa phải kết nối trực tiếp với nhân viên đang trực.</p><p class="alert alert-danger" th:if="${formError}" th:text="${formError}"></p><form th:action="@{/support}" method="post" class="panel card card-body"><input type="hidden" name="token" th:value="${supportToken}"><label for="supportSubject">Chủ đề</label><input id="supportSubject" name="subject" th:value="${subject}" minlength="5" maxlength="150" required class="form-control mb-3"><label for="supportContent">Nội dung cần hỗ trợ</label><textarea id="supportContent" name="content" th:text="${content}" minlength="5" maxlength="2000" rows="5" required class="form-control mb-3"></textarea><div class="form-check mb-3"><input id="shareConversation" name="shareConversation" value="true" type="checkbox" class="form-check-input"><label class="form-check-label" for="shareConversation">Tôi đồng ý gửi kèm hội thoại gần đây với trợ lý để nhân viên xem.</label></div><p class="small text-muted">Không chọn ô trên thì hội thoại không được gửi kèm. Không gửi mật khẩu hoặc thông tin ngân hàng nhạy cảm.</p><button class="btn btn-primary">Tạo phiếu và thông báo cho cửa hàng</button></form></main><footer th:replace="~{fragments/shop :: footer}"></footer></body></html>
