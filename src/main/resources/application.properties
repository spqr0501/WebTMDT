spring.application.name=B\u00f3ng Bakery
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=false
# Cau hinh phat trien tren may SPQR, dang nhap bang tai khoan Windows.
# trustServerCertificate=true chi danh cho SQL Server cuc bo dung chung chi tu ky.
spring.datasource.url=${DB_URL:jdbc:sqlserver://SPQR:1433;databaseName=cake_shop;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true;loginTimeout=10}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.upload-dir=${UPLOAD_DIR:./uploads}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.bank.instructions=${BANK_INSTRUCTIONS:Li\u00ean h\u1ec7 c\u1eeda h\u00e0ng \u0111\u1ec3 nh\u1eadn s\u1ed1 t\u00e0i kho\u1ea3n; ghi n\u1ed9i dung CK k\u00e8m m\u00e3 \u0111\u01a1n h\u00e0ng.}
app.shop.phone=${SHOP_PHONE:}
app.shop.address=${SHOP_ADDRESS:}
app.shop.hours=${SHOP_HOURS:}

# Khoi phuc mat khau: mac dinh tat, nguoi dung se cau hinh SMTP sau.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
